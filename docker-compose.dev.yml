services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    container_name: vttchat-backend-dev
    working_dir: /workspace/backend
    command: sh -c "node scripts/container-startup.mjs && npm run dev"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/vttchat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      NODE_ENV: development
      PRISMA_SCHEMA_SYNC_MODE: deploy
      ENABLE_PASSWORDLESS_LOGIN: ${ENABLE_PASSWORDLESS_LOGIN:-1}
      CHOKIDAR_USEPOLLING: ${DEV_WATCH_USE_POLLING:-false}
      CHOKIDAR_INTERVAL: ${DEV_WATCH_INTERVAL_MS:-150}
    volumes:
      - ./backend/src:/workspace/backend/src
      - ./backend/prisma:/workspace/backend/prisma
      - ./backend/tsconfig.json:/workspace/backend/tsconfig.json
      - ./shared:/workspace/shared
      - backend_node_modules:/workspace/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:3000,path:'/health',timeout:2500},res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.on('timeout',()=>{req.destroy();process.exit(1);});",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - vttnet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
    container_name: vttchat-frontend-dev
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped
    environment:
      # Vite dev server reads VITE_* from process.env as well as .env files
      VITE_BACKEND_URL: http://backend:3000
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080
      VITE_LIVEKIT_URL: ws://localhost:7880
      VITE_ENABLE_PASSWORDLESS_LOGIN: ${ENABLE_PASSWORDLESS_LOGIN:-1}
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-DEBUG}
      CHOKIDAR_USEPOLLING: ${DEV_WATCH_USE_POLLING:-false}
      CHOKIDAR_INTERVAL: ${DEV_WATCH_INTERVAL_MS:-150}
    volumes:
      - ./frontend/src:/workspace/frontend/src
      - ./frontend/public:/workspace/frontend/public
      - ./shared:/workspace/shared
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:5173,path:'/',timeout:2500},res=>{process.exit(res.statusCode<500?0:1)});req.on('error',()=>process.exit(1));req.on('timeout',()=>{req.destroy();process.exit(1);});",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vttnet

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: builder
    container_name: vttchat-admin-dev
    working_dir: /workspace/admin
    command: npm run dev -- --host
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: ${DEV_WATCH_USE_POLLING:-false}
      CHOKIDAR_INTERVAL: ${DEV_WATCH_INTERVAL_MS:-150}
    volumes:
      - ./admin/src:/workspace/admin/src
      - admin_node_modules:/workspace/admin/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('node:http');const ports=[5173,5174];let i=0;const check=()=>{if(i>=ports.length)process.exit(1);const req=http.get({host:'127.0.0.1',port:ports[i++],path:'/',timeout:2500},res=>process.exit(res.statusCode<500?0:1));req.on('error',check);req.on('timeout',()=>{req.destroy();check();});};check();",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    networks:
      - vttnet

  postgres:
    image: postgres:18-alpine
    container_name: vttchat-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: vttchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vttnet

  redis:
    image: redis:8-alpine
    container_name: vttchat-redis-dev
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - vttnet

  livekit:
    image: livekit/livekit-server:latest
    container_name: vttchat-livekit-dev
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    environment:
      # LIVEKIT_KEYS format: "<key>: <secret>" (YAML map)
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}'
      # Optional: pin ICE candidate IP for LAN/dev setups.
      # Leave unset to let LiveKit auto-detect.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    ports:
      - '7880:7880'
      - '7881-7980:7881-7980/udp'
      - '7881-7980:7881-7980/tcp'
    volumes:
      - ./infra/livekit/livekit.dev.yaml:/etc/livekit.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O - http://127.0.0.1:7880/ | grep -q "^OK$"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - vttnet

  caddy:
    image: caddy:2-alpine
    container_name: vttchat-caddy-dev
    restart: unless-stopped
    environment:
      # Keep Caddy's local HTTPS cert aligned with the host/IP developers actually browse.
      DEV_HOST_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - '8080:8080'
      - '8443:8443'
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data_dev:/data
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O - http://127.0.0.1:2019/config >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - vttnet

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
  admin_node_modules:
  caddy_data_dev:

networks:
  vttnet:
    driver: bridge
