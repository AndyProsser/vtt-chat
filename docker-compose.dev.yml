version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vttchat-backend-dev
    command: npm run dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/vttchat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_URL: http://livekit:7880
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - livekit
    networks:
      - vttnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vttchat-frontend-dev
    command: npm run dev -- --host
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - vttnet

  postgres:
    image: postgres:16-alpine
    container_name: vttchat-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: vttchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - vttnet

  redis:
    image: redis:7-alpine
    container_name: vttchat-redis-dev
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    networks:
      - vttnet

  livekit:
    image: livekit/livekit-server:latest
    container_name: vttchat-livekit-dev
    restart: unless-stopped
    command: >
      --dev --bind 0.0.0.0 --port 7880 --node-ip livekit --api-key ${LIVEKIT_API_KEY} --api-secret ${LIVEKIT_API_SECRET}
    networks:
      - vttnet

  caddy:
    image: caddy:2-alpine
    container_name: vttchat-caddy-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CADDY_ENV: dev
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - backend
      - frontend
      - livekit
    networks:
      - vttnet

volumes:
  postgres_data_dev:


networks:
  vttnet:
    driver: bridge
