services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    container_name: vttchat-backend-dev
    working_dir: /workspace/backend
    command: sh -c "npx prisma db push && npm run dev"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/vttchat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_URL: http://livekit:7880
      NODE_ENV: development
      ENABLE_PASSWORDLESS_LOGIN: ${ENABLE_PASSWORDLESS_LOGIN:-1}
    volumes:
      - ./backend/src:/workspace/backend/src
      - ./backend/prisma:/workspace/backend/prisma
      - ./backend/tsconfig.json:/workspace/backend/tsconfig.json
      - backend_node_modules:/workspace/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
    networks:
      - vttnet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
    container_name: vttchat-frontend-dev
    working_dir: /workspace/frontend
    command: npm run dev -- --host
    restart: unless-stopped
    environment:
      # Vite dev server reads VITE_* from process.env as well as .env files
      VITE_BACKEND_URL: http://backend:3000
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080
      VITE_LIVEKIT_URL: ws://localhost:7880
      VITE_ENABLE_PASSWORDLESS_LOGIN: ${ENABLE_PASSWORDLESS_LOGIN:-1}
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-DEBUG}
    volumes:
      - ./frontend/src:/workspace/frontend/src
      - ./frontend/public:/workspace/frontend/public
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      - backend
    networks:
      - vttnet

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: builder
    container_name: vttchat-admin-dev
    working_dir: /workspace/admin
    command: npm run dev -- --host
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./admin/src:/workspace/admin/src
      - admin_node_modules:/workspace/admin/node_modules
    depends_on:
      - backend
    networks:
      - vttnet

  postgres:
    image: postgres:18-alpine
    container_name: vttchat-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: vttchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vttnet

  redis:
    image: redis:8-alpine
    container_name: vttchat-redis-dev
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    networks:
      - vttnet

  livekit:
    image: livekit/livekit-server:latest
    container_name: vttchat-livekit-dev
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    environment:
      # LIVEKIT_KEYS format: "<key>: <secret>" (YAML map)
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
      # Optional: pin ICE candidate IP for LAN/dev setups.
      # Leave unset to let LiveKit auto-detect.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    ports:
      - '7880:7880'
      - '7881-7980:7881-7980/udp'
      - '7881-7980:7881-7980/tcp'
    volumes:
      - ./infra/livekit/livekit.dev.yaml:/etc/livekit.yaml
    networks:
      - vttnet

  caddy:
    image: caddy:2-alpine
    container_name: vttchat-caddy-dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile
    depends_on:
      - backend
      - frontend
      - admin
      - livekit
    networks:
      - vttnet

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
  admin_node_modules:

networks:
  vttnet:
    driver: bridge
