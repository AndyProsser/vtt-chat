services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vttchat-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/vttchat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_URL: http://livekit:7880
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
    networks:
      - vttnet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://localhost:8443}
        VITE_WS_URL: ${VITE_WS_URL:-wss://localhost:8443}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-wss://localhost:7880}
    container_name: vttchat-frontend
    restart: unless-stopped
    networks:
      - vttnet

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: vttchat-admin
    restart: unless-stopped
    networks:
      - vttnet

  postgres:
    image: postgres:17-alpine
    container_name: vttchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vttchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vttnet

  redis:
    image: redis:8-alpine
    container_name: vttchat-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - vttnet

  livekit:
    image: livekit/livekit-server:latest
    container_name: vttchat-livekit
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    environment:
      # LIVEKIT_KEYS format: "<key>: <secret>" (YAML map, one entry per line for multiple)
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
      # Pin the public IP that LiveKit advertises in ICE candidates.
      # If unset, LiveKit auto-detects via STUN (requires outbound internet).
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    ports:
      - '7880:7880'
      # 1100 ports → up to 1100 concurrent audio streams.
      # Each WebRTC media track consumes one UDP port.
      # Expand range and update livekit.yaml port_range_end to scale further.
      - '7881-8980:7881-8980/udp'
      - '7881:7881/tcp' # TCP fallback for clients that can't use UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - vttnet

  caddy:
    image: caddy:2-alpine
    container_name: vttchat-caddy
    restart: unless-stopped
    ports:
      - '8443:8443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/certs:/certs
      - caddy_data:/data
    depends_on:
      - backend
      - frontend
      - admin
      - livekit
    networks:
      - vttnet

volumes:
  postgres_data:
  redis_data:
  caddy_data:

networks:
  vttnet:
    driver: bridge
