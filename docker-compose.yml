version: "3.9"

services:
  backend:
    build: ./backend
    container_name: vttchat-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/vttchat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_URL: http://livekit:7880
    depends_on:
      - postgres
      - redis
      - livekit
    networks:
      - vttnet

  frontend:
    build: ./frontend
    container_name: vttchat-frontend
    restart: unless-stopped
    networks:
      - vttnet

  admin:
    build: ./admin
    container_name: vttchat-admin
    restart: unless-stopped
    networks:
      - vttnet

  postgres:
    image: postgres:16-alpine
    container_name: vttchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vttchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vttnet

  redis:
    image: redis:7-alpine
    container_name: vttchat-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    networks:
      - vttnet

  livekit:
    image: livekit/livekit-server:latest
    container_name: vttchat-livekit
    restart: unless-stopped
    command: >
      --config /etc/livekit.yaml --node-ip livekit --api-key ${LIVEKIT_API_KEY} --api-secret ${LIVEKIT_API_SECRET}
    ports:
      - "7880:7880"
      - "7881-7980:7881-7980/udp"
      - "7881-7980:7881-7980/tcp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - vttnet

  caddy:
    image: caddy:2-alpine
    container_name: vttchat-caddy
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/certs:/certs
    depends_on:
      - backend
      - frontend
      - admin
      - livekit
    networks:
      - vttnet

volumes:
  postgres_data:


networks:
  vttnet:
    driver: bridge
