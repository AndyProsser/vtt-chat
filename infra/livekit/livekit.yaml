port: 7880
bind_addresses:
  - '0.0.0.0'

# Room settings optimized for voice-only
room:
  auto_cleanup: true
  empty_timeout: 300 # 5 minutes

# RTC — production supports 1100 simultaneous audio streams (ports 7881-8980).
# One UDP port is consumed per media track per participant.
# To scale beyond 1100 concurrent streams, expand port_range_end and the
# matching `ports:` mapping in docker-compose.yml accordingly.
rtc:
  port_range_start: 7881
  port_range_end: 8980 # 1100 ports → 1100 concurrent streams
  # use_external_ip causes LiveKit to auto-detect its public IP via STUN.
  # Override with LIVEKIT_NODE_IP env var to pin a specific address instead.
  use_external_ip: true
  tcp_port: 7881

  audio_codec: opus
  video_enabled: false

  ice_servers:
    - urls:
        - 'stun:stun.l.google.com:19302'
        - 'stun:stun1.l.google.com:19302'

# Logging
logging:
  level: info
  sample: false

development: false

# Session/Connection management
session:
  max_participant_metadata_size: 1000
  max_participant_name_length: 256
