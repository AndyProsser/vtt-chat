port: 7880
bind_addresses:
  - '0.0.0.0'

# Room settings
room:
  empty_timeout: 300 # 5 minutes

# RTC — dev supports up to 100 simultaneous audio streams (100 ports)
# One UDP port is consumed per media track per participant.
rtc:
  port_range_start: 7881
  port_range_end: 7980 # 100 ports → 100 concurrent streams
  # Keep public IP discovery off in dev, but let LIVEKIT_NODE_IP provide a
  # host-reachable LAN address when the container is running under Docker.
  use_external_ip: false
  tcp_port: 7881

# Logging — verbose in dev
logging:
  level: debug
  sample: false

# Enable LiveKit development mode (relaxed auth checks, additional diagnostics)
development: true
